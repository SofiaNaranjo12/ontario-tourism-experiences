<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Map — Ontario Tourism Experiences</title>
  <meta name="description" content="Interactive map of the 24 Ontario experiences of this guide, filterable by world and region." data-i18n-attr="content:meta.map">
  <meta name="theme-color" content="#17352B">

  <!-- Early language flag (same snippet on every page) -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var l = (location.search.match(/[?&]lang=(es|en)/) || [])[1] || localStorage.getItem('ote-lang');
        if (l === 'es') { d.lang = 'es'; d.classList.add('i18n-pending'); }
      } catch (e) {}
      setTimeout(function () { d.classList.remove('i18n-pending'); }, 1500);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap">
  <!-- Leaflet 1.9.4 (map engine, ~40 KB gzip) + Canada Basemap tiles (Natural Resources Canada) -->
  <link rel="preconnect" href="https://maps-cartes.services.geo.ca">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="js/language.js" defer></script>
  <script src="js/worlds-i18n.js" defer></script>
  <script src="js/experiences.js" defer></script>
  <script src="js/favourites.js" defer></script>
  <script src="js/map.js" defer></script>
  <script src="js/main.js" defer></script>
</head>

<body id="top" data-page="map" data-page-title="title.map">

  <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

  <!-- Shared header (rendered by js/main.js) -->
  <div data-component="site-header"></div>

  <noscript><p class="noscript">This experience needs JavaScript enabled. / Esta experiencia necesita JavaScript activado.</p></noscript>

  <main id="main">

    <!-- =====================================================
         INTRO
         ===================================================== -->
    <header class="atlas-head" aria-labelledby="atlas-title">
      <figure class="atlas-head__media reveal-img">
        <img src="images/home/map-bruce-peninsula.webp" width="1600" height="1067" alt="" decoding="async" data-depth="-0.06">
      </figure>
      <div class="atlas-head__text">
        <p class="eyebrow reveal" data-i18n="map.eyebrow">Explore Ontario</p>
        <h1 class="display-xl reveal reveal--title" style="--d:1" id="atlas-title" data-i18n-html="map.title">Where will<br><em>you go next?</em></h1>
      </div>
      <div class="atlas-head__side">
        <p class="lede reveal" style="--d:2" data-i18n="map.lede"></p>
        <ul class="stats" data-stagger>
          <li><span class="stats__num">24</span><span class="stats__label" data-i18n="map.s1">Experiences</span></li>
          <li><span class="stats__num">06</span><span class="stats__label" data-i18n="map.s2">Regions</span></li>
          <li><span class="stats__num">04</span><span class="stats__label" data-i18n="map.s3">Worlds</span></li>
        </ul>
      </div>
      <p class="photo-caption atlas-head__caption"><span data-i18n="common.photo">Photo</span> — Bruce Peninsula National Park</p>
    </header>

    <!-- =====================================================
         LIST + MAP — one interface (js/map.js)
         ===================================================== -->
    <section class="atlas" id="atlas" data-atlas aria-labelledby="atlas-results-title">
      <div class="atlas-panel">
        <div class="atlas-filters" role="group" data-i18n-attr="aria-label:map.filters">
          <p class="atlas-filters__label" id="filter-world" data-i18n="map.world">World</p>
          <ul class="atlas-chips" data-filter-cats aria-labelledby="filter-world"></ul>
          <p class="atlas-filters__label" id="filter-region" data-i18n="map.region">Region</p>
          <ul class="atlas-chips atlas-chips--regions" data-filter-regions aria-labelledby="filter-region"></ul>
        </div>

        <div class="atlas-set" data-set hidden>
          <p><span class="pulse-dot" aria-hidden="true"></span><strong data-set-label></strong> <span data-set-count></span></p>
          <button type="button" class="atlas-clear" data-clear-set><span data-i18n="map.set.showAll">Show all 24</span> <span aria-hidden="true">×</span></button>
        </div>

        <div class="atlas-count">
          <h2 class="sr-only" id="atlas-results-title" data-i18n="map.results">Experiences on the map</h2>
          <p aria-live="polite"><strong data-count-n>24</strong> <span data-count-label>experiences</span></p>
          <button type="button" class="atlas-clear" data-reset hidden><span data-i18n="map.clear">Clear filters</span> <span aria-hidden="true">×</span></button>
        </div>

        <ol class="atlas-list" data-i18n-attr="aria-label:map.listLabel"></ol>

        <div class="atlas-empty" hidden>
          <p data-i18n="map.empty">No experience matches this combination.</p>
          <button type="button" class="link-arrow" data-reset><span data-i18n="map.reset">Show all</span><span class="arrow" aria-hidden="true"></span></button>
        </div>
      </div>

      <div class="atlas-map">
        <p class="sr-only" data-i18n="map.keyboard"></p>
        <div class="atlas-map__canvas"></div>
        <article class="atlas-card" data-i18n-attr="aria-label:map.cardLabel" aria-live="polite" hidden></article>
      </div>
    </section>

  </main>

  <!-- Photo credits for this page (inserted into the footer) -->
  <template id="page-credits">
    <li><a href="https://commons.wikimedia.org/wiki/File:Bruce_Peninsula_National_Park_cliffs.jpg" target="_blank" rel="noopener">The Cosmonaut</a> — CC BY-SA 2.5 CA</li>
    <li><span data-i18n="credits.results">Experience photos: same authors as on the four world pages.</span></li>
    <li data-i18n-html="map.attrFooter">Map: Canada Base Map – Transportation © <a href="https://natural-resources.canada.ca/" target="_blank" rel="noopener">Natural Resources Canada</a>. Contains information licensed under the <a href="https://open.canada.ca/en/open-government-licence-canada" target="_blank" rel="noopener">Open Government Licence – Canada</a> · <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a></li>
  </template>

  <!-- Shared footer (rendered by js/main.js) -->
  <div data-component="site-footer"></div>

</body>
</html>
